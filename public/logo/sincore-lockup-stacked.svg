<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="sincore">
  <title>sincore — stacked lockup</title>
  <rect width="200" height="220" fill="#0a0a0f"/>

  <g transform="translate(52 16)">
    <rect width="96" height="96" rx="12" fill="#0a0a0f"/>
    <rect x="3.5" y="3.5" width="89" height="89" rx="9" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <text x="48" y="70" font-family="'Courier New', ui-monospace, monospace" font-size="50" font-weight="700" text-anchor="middle">
      <tspan fill="#e2e8f0">s</tspan><tspan fill="#8b5cf6">c</tspan>
    </text>
  </g>

  <text x="100" y="170" font-family="'Courier New', ui-monospace, monospace" font-size="36" font-weight="700" letter-spacing="-1" text-anchor="middle">
    <tspan fill="#e2e8f0">sin</tspan><tspan fill="#8b5cf6">core</tspan>
  </text>

  <text x="100" y="200" font-family="'Courier New', ui-monospace, monospace" font-size="12" fill="#7c3aed" font-style="italic" text-anchor="middle" opacity="0.7">
    It works. That's the point.
  </text>
</svg>
